stages:
  - lint
  - test
  - build

# Безопасность: SAST + поиск секретов в коде
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

# --- ЛИНТЕРЫ ---
lint:backend:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir ruff==0.8.4
  script:
    - cd backend
    - ruff check .
    - ruff format --check .
  allow_failure: true # временно: убрать после исправления замечаний (A1.2)

lint:frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
    - npm install --no-save eslint@9 @eslint/js@9 globals eslint-plugin-react-hooks@5
  script:
    - npx eslint src
  allow_failure: true # временно: убрать после исправления замечаний (A1.2)

# --- ТЕСТЫ BACKEND ---
test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: ai_hr_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DATABASE_URL: "postgresql://test_user:test_pass@postgres:5432/ai_hr_test"
    JWT_SECRET: "test-secret-key-for-ci"
    GROQ_API_KEY: "fake-key-for-tests"
    FRONTEND_URL: "http://localhost:3000"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
    - cd backend
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest -v --tb=short --cov=app --cov-report=term
  coverage: '/TOTAL.*\s+(\d+)%/'

# --- ЮНИТ-ТЕСТЫ FRONTEND (Vitest) ---
test:frontend:unit:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
    # Тестовые зависимости ставятся on-the-fly, чтобы не ломать package-lock.json
    - npm install --no-save vitest@2 jsdom@25 @testing-library/react@16 @testing-library/dom@10 @testing-library/jest-dom@6
  script:
    - npx vitest run

# --- ТЕСТЫ FRONTEND (сборка) ---
test:frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# --- BUILD DOCKER IMAGES (только master) ---
build:backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f Dockerfile.backend -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - master

build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f Dockerfile.frontend -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - master

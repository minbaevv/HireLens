# Только БД в Docker, backend и frontend запускаются нативно
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_hr_db
      POSTGRES_USER: ai_hr_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_hr_user -d ai_hr_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:

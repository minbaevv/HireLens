name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # --- ЛИНТЕРЫ ---
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir ruff==0.8.4
      - name: ruff
        working-directory: backend
        continue-on-error: true # временно: убрать после исправления замечаний (A1.2)
        run: |
          ruff check .
          ruff format --check .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save eslint@9 @eslint/js@9 globals eslint-plugin-react-hooks@5
      - name: eslint
        working-directory: frontend
        continue-on-error: true # временно: убрать после исправления замечаний (A1.2)
        run: npx eslint src

  # --- ТЕСТЫ BACKEND ---
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_hr_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test_user:test_pass@localhost:5432/ai_hr_test"
      JWT_SECRET: "test-secret-key-for-ci"
      GROQ_API_KEY: "fake-key-for-tests"
      FRONTEND_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libpq-dev
          pip install --no-cache-dir -r requirements.txt
      - name: pytest
        working-directory: backend
        run: pytest -v --tb=short --cov=app --cov-report=term

  # --- ЮНИТ-ТЕСТЫ FRONTEND (Vitest) ---
  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        working-directory: frontend
        # Тестовые зависимости ставятся on-the-fly, чтобы не ломать package-lock.json
        run: |
          npm ci
          npm install --no-save vitest@2 jsdom@25 @testing-library/react@16 @testing-library/dom@10 @testing-library/jest-dom@6
      - name: vitest
        working-directory: frontend
        run: npx vitest run

  # --- СБОРКА FRONTEND ---
  test-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # --- BUILD & PUSH DOCKER IMAGES (только main/master) ---
  build-images:
    needs: [ test-backend, test-frontend-build ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        run: |
          IMG=ghcr.io/${{ github.repository }}/backend
          docker build -f Dockerfile.backend -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"
      - name: Build & push frontend
        run: |
          IMG=ghcr.io/${{ github.repository }}/frontend
          docker build -f Dockerfile.frontend -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F — базовые ошибки, I — сортировка импортов, B — баги, UP — современный синтаксис
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"] # длину строк контролирует форматтер

[tool.pytest.ini_options]
testpaths = ["tests"]

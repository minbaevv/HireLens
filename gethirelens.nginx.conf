# HireLens — reverse proxy на УЖЕ СУЩЕСТВУЮЩЕМ host nginx.
# Соседствует с проектом handlyman — его не трогаем.
#
# HireLens-контейнеры слушают только localhost:
#   frontend -> 127.0.0.1:8081
#   backend  -> 127.0.0.1:8010
#
# УСТАНОВКА:
#   sudo cp gethirelens.nginx.conf /etc/nginx/sites-available/gethirelens.tech
#   sudo ln -s /etc/nginx/sites-available/gethirelens.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gethirelens.tech -d www.gethirelens.tech -d api.gethirelens.tech
# certbot сам добавит listen 443 ssl и редирект с http.

server {
    listen 80;
    listen [::]:80;
    server_name gethirelens.tech www.gethirelens.tech;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gethirelens.tech;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

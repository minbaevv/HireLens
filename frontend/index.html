<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="HireLens — AI-скрининг кандидатов" />
    <meta property="og:description" content="Пройдите короткое AI-интервью по вакансии." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%2322d3ee' stroke-linecap='round' stroke-linejoin='round'><path d='M10 30 A 22 22 0 0 1 30 10' stroke-width='2.4'/><path d='M40 15 C 30 13, 21 20, 21 31 C 21 37, 24 40, 24 44 L 20 48 L 26 50 L 26 54' stroke-width='2.6'/><path d='M27 24 H 37' stroke-width='1.8'/><path d='M31 31 H 42' stroke-width='1.8'/><path d='M28 38 H 35' stroke-width='1.8'/><path d='M37 24 V 31' stroke-width='1.8'/><path d='M24 34 L 32 43 L 52 18' stroke-width='5'/></svg>" />

    <!-- PWA (B3) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color зависит от темы (D1.4): светлая — brand-600, тёмная — slate-950 -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HireLens" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Анти-FOUC (D1): выставляем класс темы до первого рендера,
         чтобы не мелькала светлая тема при выбранной тёмной. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

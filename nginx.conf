server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # OG-превью вакансий для соцсетей/мессенджеров: краулерам отдаём мета-теги, людям — SPA.
    location ~ ^/apply/(?<apply_token>[^/?]+) {
        if ($http_user_agent ~* "(facebookexternalhit|WhatsApp|Twitterbot|TelegramBot|Telegram|Slackbot|LinkedInBot|Discordbot|vkShare|redditbot|Pinterest|Googlebot|Bingbot|SkypeUriPreview)") {
            proxy_pass http://backend:8000/apply/$apply_token/og;
        }
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
